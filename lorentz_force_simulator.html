<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorentz Force Simulator — PhysSandbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sandbox: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-sandbox-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden no-select">

    <!-- Top Navigation Header -->
    <header class="h-14 bg-sandbox-800 border-b border-gray-800 px-4 flex items-center justify-between shrink-0 z-20 relative">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-purple-600 to-red-500 text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-purple-500/20 shrink-0">
                <i class="fa-solid fa-atom text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-none text-white flex items-center gap-2">
                    Lorentz Force <span class="text-xs bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded border border-purple-500/30">PhysSandbox 3D</span>
                </h1>
                <p class="text-[10px] text-gray-400 mt-0.5">Electromagnetism Vector Simulation Engine</p>
            </div>
        </div>

        <div class="flex items-center space-x-4 text-xs font-mono">
            <div class="flex items-center gap-2 px-3 py-1 bg-sandbox-900 rounded border border-gray-800">
                <span class="w-3 h-3 rounded-full bg-blue-500 block"></span> <span class="text-gray-300">B-Field (Magnetic)</span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-sandbox-900 rounded border border-gray-800">
                <span class="w-3 h-3 rounded-full bg-emerald-500 block"></span> <span class="text-gray-300">Velocity/Current</span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 bg-sandbox-900 rounded border border-gray-800">
                <span class="w-3 h-3 rounded-full bg-red-500 block"></span> <span class="text-gray-300">Lorentz Force</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Left Toolbar / Controls Sidebar -->
        <aside class="w-[340px] bg-sandbox-800/90 border-r border-gray-800 flex flex-col z-10 overflow-y-auto pb-12 relative shadow-2xl shrink-0">
            
            <!-- Simulation Scenarios -->
            <div class="p-3 border-b border-gray-800">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Simulation Scenario</label>
                <div class="grid grid-cols-1 gap-2">
                    <button id="btn-mode-wire" onclick="setMode('wire')" class="mode-btn p-2.5 rounded-lg border border-purple-500 bg-purple-600/20 text-white text-xs font-medium flex items-center gap-3 transition text-left">
                        <i class="fa-solid fa-minus text-lg w-5 text-center text-purple-400"></i>
                        <div>
                            <div class="font-bold">Wire in B-Field</div>
                            <div class="text-[9px] font-mono text-gray-300">F = I(L × B)</div>
                        </div>
                    </button>
                    <button id="btn-mode-charge" onclick="setMode('charge')" class="mode-btn p-2.5 rounded-lg border border-gray-700 bg-sandbox-700/50 hover:bg-gray-700 text-gray-300 text-xs font-medium flex items-center gap-3 transition text-left">
                        <i class="fa-solid fa-circle-dot text-lg w-5 text-center text-emerald-400"></i>
                        <div>
                            <div class="font-bold">Moving Charge</div>
                            <div class="text-[9px] font-mono text-gray-400">F = q(v × B)</div>
                        </div>
                    </button>
                    <button id="btn-mode-twowires" onclick="setMode('twowires')" class="mode-btn p-2.5 rounded-lg border border-gray-700 bg-sandbox-700/50 hover:bg-gray-700 text-gray-300 text-xs font-medium flex items-center gap-3 transition text-left">
                        <i class="fa-solid fa-pause text-lg w-5 text-center text-amber-400"></i>
                        <div>
                            <div class="font-bold">Parallel Wires</div>
                            <div class="text-[9px] font-mono text-gray-400">Mutual Inductive Force</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Camera Views -->
            <div class="p-3 border-b border-gray-800 bg-sandbox-900/50">
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-2">Camera Perspective</label>
                <div class="grid grid-cols-3 gap-1.5 mb-1.5">
                    <button onclick="setView('top')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-300 transition">Top (+Y)</button>
                    <button onclick="setView('front')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-300 transition">Front (+Z)</button>
                    <button onclick="setView('right')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-300 transition">Right (+X)</button>
                </div>
                <div class="grid grid-cols-3 gap-1.5 mb-2">
                    <button onclick="setView('bottom')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-400 transition">Bottom (-Y)</button>
                    <button onclick="setView('back')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-400 transition">Back (-Z)</button>
                    <button onclick="setView('left')" class="py-1.5 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-[10px] font-bold text-gray-400 transition">Left (-X)</button>
                </div>
                <button onclick="setView('iso')" class="w-full py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 rounded border border-indigo-500/50 text-[11px] font-bold text-indigo-300 transition">
                    <i class="fa-solid fa-cube mr-1"></i> 3D Isometric View
                </button>
            </div>

            <!-- Parameters Inspector -->
            <div id="inspector-panel" class="p-3 flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Physics Parameters</label>
                </div>
                <div id="inspector-content" class="space-y-4">
                    <!-- Dynamic Content based on Mode -->
                </div>
            </div>
            
        </aside>

        <!-- Main 3D Canvas Area -->
        <main id="canvas-container" class="flex-1 relative bg-slate-950 flex flex-col justify-center items-center overflow-hidden">
            <!-- Three.js mounts here -->
            
            <div id="instruction-overlay" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 pointer-events-none glass-panel px-4 py-2 rounded-full text-xs text-gray-300 border border-gray-700 shadow-2xl flex items-center gap-2">
                <i class="fa-solid fa-mouse text-gray-400"></i>
                <span>Left Click to Rotate | Right Click to Pan | Scroll to Zoom</span>
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- GLOBAL STATE ---
        const state = {
            mode: 'wire', // 'wire', 'charge', 'twowires'
            
            // External B-Field (for Wire and Charge modes)
            Bx: 0, By: 1.0, Bz: 0,
            
            // Mode: Wire
            wireCurrent: 5.0,
            
            // Mode: Charge
            q: 1.0,
            chargeVx: 5.0, chargeVy: 0.0, chargeVz: 0.0,
            chargePos: new THREE.Vector3(0, 0, 0),
            chargeVel: new THREE.Vector3(5.0, 0.0, 0.0),
            isPlaying: false,
            trailPoints: [],
            
            // Mode: Two Wires
            i1: 5.0,
            i2: -5.0,
            distance: 4.0
        };

        // --- COLORS ---
        const COLOR_B = 0x3b82f6; // Blue
        const COLOR_V = 0x10b981; // Green
        const COLOR_F = 0xef4444; // Red
        const COLOR_WIRE = 0x94a3b8; // Slate

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0b0f19');

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Ground Grid
        const gridHelper = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // Axes Helper (RGB = XYZ)
        const axesHelper = new THREE.AxesHelper(3);
        axesHelper.position.y = -4.9;
        scene.add(axesHelper);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- SCENE OBJECTS ---
        const dynamicObjects = new THREE.Group();
        scene.add(dynamicObjects);

        // Materials & Geometries
        const wireMat = new THREE.MeshPhongMaterial({ color: COLOR_WIRE });
        const wireGeo = new THREE.CylinderGeometry(0.2, 0.2, 20, 16);
        wireGeo.rotateZ(Math.PI / 2); // Align along X axis

        const chargeMat = new THREE.MeshPhongMaterial({ color: 0xf59e0b });
        const chargeGeo = new THREE.SphereGeometry(0.5, 32, 32);
        
        let chargeMesh = null;
        let trailLine = null;
        let arrows = []; // Store ArrowHelpers to update them easily

        function clearDynamicScene() {
            while(dynamicObjects.children.length > 0){ 
                const child = dynamicObjects.children[0];
                dynamicObjects.remove(child); 
            }
            arrows = [];
            chargeMesh = null;
            trailLine = null;
        }

        // --- BUILD SCENARIOS ---
        
        // Helper to draw grid of external B field
        function drawExternalBFieldGrid(bVec) {
            if (bVec.length() < 0.01) return;
            const dir = bVec.clone().normalize();
            const len = Math.max(1, bVec.length() * 2);
            for(let x = -8; x <= 8; x+=4) {
                for(let z = -8; z <= 8; z+=4) {
                    const origin = new THREE.Vector3(x, -3, z);
                    const arrow = new THREE.ArrowHelper(dir, origin, len, COLOR_B, 0.4, 0.3);
                    dynamicObjects.add(arrow);
                }
            }
        }

        function buildWireScene() {
            const bVec = new THREE.Vector3(state.Bx, state.By, state.Bz);
            drawExternalBFieldGrid(bVec);

            // Wire
            const wire = new THREE.Mesh(wireGeo, wireMat);
            dynamicObjects.add(wire);

            // Current Vector (Green)
            const dirI = new THREE.Vector3(Math.sign(state.wireCurrent) || 1, 0, 0);
            const lenI = Math.max(1, Math.abs(state.wireCurrent));
            const originI = new THREE.Vector3(0, 0, 0);
            const arrowI = new THREE.ArrowHelper(dirI, originI, lenI, COLOR_V, 0.5, 0.4);
            dynamicObjects.add(arrowI);

            // Force Vector (Red) -> F = I x B (L is implicit along X)
            const Ivec = new THREE.Vector3(state.wireCurrent, 0, 0);
            const Fvec = new THREE.Vector3().crossVectors(Ivec, bVec);
            
            if (Fvec.length() > 0.01) {
                const dirF = Fvec.clone().normalize();
                const lenF = Math.max(1, Fvec.length());
                const arrowF = new THREE.ArrowHelper(dirF, new THREE.Vector3(0,0,0), lenF, COLOR_F, 0.8, 0.6);
                dynamicObjects.add(arrowF);
            }
        }

        function buildChargeScene() {
            const bVec = new THREE.Vector3(state.Bx, state.By, state.Bz);
            drawExternalBFieldGrid(bVec);

            chargeMesh = new THREE.Mesh(chargeGeo, chargeMat);
            dynamicObjects.add(chargeMesh);

            // Trail setup
            const trailGeo = new THREE.BufferGeometry();
            const trailMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.6 });
            trailLine = new THREE.Line(trailGeo, trailMat);
            dynamicObjects.add(trailLine);

            // Dynamic Arrows (attached to charge)
            const arrowV = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 1, COLOR_V, 0.5, 0.4);
            const arrowF = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 1, COLOR_F, 0.5, 0.4);
            dynamicObjects.add(arrowV);
            dynamicObjects.add(arrowF);
            arrows.push({ type: 'V', obj: arrowV });
            arrows.push({ type: 'F', obj: arrowF });

            updateChargeVisuals();
        }

        function buildTwoWiresScene() {
            const d = state.distance;
            const w1z = -d/2;
            const w2z = d/2;

            // Wire 1
            const wire1 = new THREE.Mesh(wireGeo, wireMat);
            wire1.position.z = w1z;
            dynamicObjects.add(wire1);

            // Wire 2
            const wire2 = new THREE.Mesh(wireGeo, wireMat);
            wire2.position.z = w2z;
            dynamicObjects.add(wire2);

            // Current Vectors
            const d1 = new THREE.Vector3(Math.sign(state.i1)||1, 0, 0);
            const d2 = new THREE.Vector3(Math.sign(state.i2)||1, 0, 0);
            const arrI1 = new THREE.ArrowHelper(d1, new THREE.Vector3(0, 0.5, w1z), Math.abs(state.i1)*0.5, COLOR_V, 0.4, 0.3);
            const arrI2 = new THREE.ArrowHelper(d2, new THREE.Vector3(0, 0.5, w2z), Math.abs(state.i2)*0.5, COLOR_V, 0.4, 0.3);
            dynamicObjects.add(arrI1);
            dynamicObjects.add(arrI2);

            // Calculate Forces (Simplified relative representation)
            // F/L = (mu0 * I1 * I2) / (2 * pi * d)
            // Force direction: Parallel currents attract, anti-parallel repel.
            const forceMag = (state.i1 * state.i2) / d; // arbitrary scaling for visual
            
            if(Math.abs(forceMag) > 0.01) {
                // Vector points towards each other if attractive (+ forceMag), away if repulsive (- forceMag)
                const dir1 = new THREE.Vector3(0, 0, 1 * Math.sign(forceMag));
                const dir2 = new THREE.Vector3(0, 0, -1 * Math.sign(forceMag));
                const lenF = Math.max(1, Math.abs(forceMag) * 2);
                
                const f1 = new THREE.ArrowHelper(dir1, new THREE.Vector3(0, 0, w1z), lenF, COLOR_F, 0.6, 0.4);
                const f2 = new THREE.ArrowHelper(dir2, new THREE.Vector3(0, 0, w2z), lenF, COLOR_F, 0.6, 0.4);
                dynamicObjects.add(f1);
                dynamicObjects.add(f2);
            }

            // Draw Magnetic Field Rings (Wire 1 affecting Wire 2)
            const ringGeo = new THREE.RingGeometry(d-0.05, d+0.05, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: COLOR_B, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.y = Math.PI / 2;
            ring.position.z = w1z;
            dynamicObjects.add(ring);
            
            // Add tiny B arrows on the ring at Wire 2's location
            // B field from wire 1 at wire 2. Direction depends on I1.
            // Right hand rule: I1 is along X. r vector is +Z. B = I x r = X cross Z = -Y.
            const bDirY = Math.sign(state.i1) * -1;
            if (bDirY !== 0) {
                const bDir = new THREE.Vector3(0, bDirY, 0);
                const bArr = new THREE.ArrowHelper(bDir, new THREE.Vector3(0, 0, w2z), 2, COLOR_B, 0.5, 0.4);
                dynamicObjects.add(bArr);
            }
        }

        // --- UPDATE LOOPS ---

        function updateChargeVisuals() {
            if (!chargeMesh) return;
            chargeMesh.position.copy(state.chargePos);
            
            const bVec = new THREE.Vector3(state.Bx, state.By, state.Bz);
            const fVec = new THREE.Vector3().crossVectors(state.chargeVel, bVec).multiplyScalar(state.q);

            arrows.forEach(item => {
                if (item.type === 'V') {
                    if (state.chargeVel.length() > 0.01) {
                        item.obj.setDirection(state.chargeVel.clone().normalize());
                        item.obj.setLength(Math.max(1, state.chargeVel.length() * 0.5));
                        item.obj.position.copy(state.chargePos);
                        item.obj.visible = true;
                    } else item.obj.visible = false;
                }
                if (item.type === 'F') {
                    if (fVec.length() > 0.01) {
                        item.obj.setDirection(fVec.clone().normalize());
                        item.obj.setLength(Math.max(1, fVec.length() * 0.2));
                        item.obj.position.copy(state.chargePos);
                        item.obj.visible = true;
                    } else item.obj.visible = false;
                }
            });

            if(trailLine && state.trailPoints.length > 0) {
                trailLine.geometry.setFromPoints(state.trailPoints);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (state.mode === 'charge' && state.isPlaying) {
                const bVec = new THREE.Vector3(state.Bx, state.By, state.Bz);
                // Lorentz force: F = q(v x B). Assume mass = 1 for simplicity so a = F.
                const F = new THREE.Vector3().crossVectors(state.chargeVel, bVec).multiplyScalar(state.q);
                
                const dt = 0.016; // 60fps
                state.chargeVel.add(F.multiplyScalar(dt));
                state.chargePos.add(state.chargeVel.clone().multiplyScalar(dt));
                
                // Keep trail managed
                state.trailPoints.push(state.chargePos.clone());
                if(state.trailPoints.length > 200) state.trailPoints.shift();

                updateChargeVisuals();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();


        // --- UI & STATE BINDINGS ---
        
        window.setMode = (mode) => {
            state.mode = mode;
            
            // Update UI buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn p-2.5 rounded-lg border border-gray-700 bg-sandbox-700/50 hover:bg-gray-700 text-gray-300 text-xs font-medium flex items-center gap-3 transition text-left";
            });
            document.getElementById(`btn-mode-${mode}`).className = "mode-btn p-2.5 rounded-lg border border-purple-500 bg-purple-600/20 text-white text-xs font-medium flex items-center gap-3 transition text-left";

            buildUI();
            
            // Reset states
            state.isPlaying = false;
            state.chargePos.set(0,0,0);
            state.chargeVel.set(state.chargeVx, state.chargeVy, state.chargeVz);
            state.trailPoints = [state.chargePos.clone()];

            clearDynamicScene();
            if (mode === 'wire') buildWireScene();
            else if (mode === 'charge') buildChargeScene();
            else if (mode === 'twowires') buildTwoWiresScene();

            // Set default comfortable view
            window.setView('iso');
        };

        window.setView = (view) => {
            const dist = 25;
            switch(view) {
                case 'top': camera.position.set(0, dist, 0); break;
                case 'bottom': camera.position.set(0, -dist, 0); break;
                case 'front': camera.position.set(0, 0, dist); break;
                case 'back': camera.position.set(0, 0, -dist); break;
                case 'right': camera.position.set(dist, 0, 0); break;
                case 'left': camera.position.set(-dist, 0, 0); break;
                case 'iso': camera.position.set(15, 15, 15); break;
            }
            camera.lookAt(0,0,0);
            controls.target.set(0,0,0);
        };

        window.updateParam = (prop, val) => {
            state[prop] = parseFloat(val);
            
            // Update labels immediately
            const lbl = document.getElementById(`lbl-${prop}`);
            if (lbl) {
                if (prop === 'q') lbl.innerText = `${state.q > 0 ? '+':''}${state.q} C`;
                else lbl.innerText = state[prop].toFixed(1);
            }

            // Sync charge vel manually if not playing
            if(state.mode === 'charge' && !state.isPlaying) {
                if (prop === 'chargeVx' || prop === 'chargeVy' || prop === 'chargeVz') {
                    state.chargeVel.set(state.chargeVx, state.chargeVy, state.chargeVz);
                    updateChargeVisuals();
                }
            }

            // Rebuild static scenes entirely on slider move for wires
            if (state.mode === 'wire') { clearDynamicScene(); buildWireScene(); }
            if (state.mode === 'twowires') { clearDynamicScene(); buildTwoWiresScene(); }
            
            // For charge mode, if B-field changes, redraw the static B field grid but keep charge state
            if (state.mode === 'charge' && (prop === 'Bx' || prop === 'By' || prop === 'Bz')) {
                // To keep it simple, just wipe and rebuild but restore positions
                const tempPos = state.chargePos.clone();
                const tempVel = state.chargeVel.clone();
                const tempTrail = [...state.trailPoints];
                clearDynamicScene();
                buildChargeScene();
                state.chargePos.copy(tempPos);
                state.chargeVel.copy(tempVel);
                state.trailPoints = tempTrail;
                updateChargeVisuals();
            }
        };

        window.togglePlay = () => {
            state.isPlaying = !state.isPlaying;
            document.getElementById('btn-play').innerHTML = state.isPlaying ? '<i class="fa-solid fa-pause"></i> Pause' : '<i class="fa-solid fa-play"></i> Play';
            document.getElementById('btn-play').className = state.isPlaying ? 
                'w-full py-2 bg-amber-500 hover:bg-amber-600 text-white rounded font-bold transition flex items-center justify-center gap-2' : 
                'w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded font-bold transition flex items-center justify-center gap-2';
        };

        window.resetCharge = () => {
            state.isPlaying = false;
            document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-play"></i> Play';
            document.getElementById('btn-play').className = 'w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded font-bold transition flex items-center justify-center gap-2';
            
            state.chargePos.set(0,0,0);
            state.chargeVel.set(state.chargeVx, state.chargeVy, state.chargeVz);
            state.trailPoints = [state.chargePos.clone()];
            updateChargeVisuals();
        };

        // --- DYNAMIC UI BUILDER ---
        function buildUI() {
            const panel = document.getElementById('inspector-content');
            let html = '';

            // Common B-Field block for Wire and Charge modes
            const bFieldHTML = `
                <div class="bg-sandbox-900 p-2.5 rounded border border-blue-900/40">
                    <label class="text-[10px] uppercase font-bold text-blue-400 block mb-2">External B-Field (Tesla)</label>
                    <div class="space-y-2">
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400"><span>Bx</span><span id="lbl-Bx">${state.Bx.toFixed(1)}</span></div>
                            <input type="range" min="-5" max="5" step="0.1" value="${state.Bx}" oninput="updateParam('Bx', this.value)" class="w-full h-1 bg-gray-700 rounded accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400"><span>By</span><span id="lbl-By">${state.By.toFixed(1)}</span></div>
                            <input type="range" min="-5" max="5" step="0.1" value="${state.By}" oninput="updateParam('By', this.value)" class="w-full h-1 bg-gray-700 rounded accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400"><span>Bz</span><span id="lbl-Bz">${state.Bz.toFixed(1)}</span></div>
                            <input type="range" min="-5" max="5" step="0.1" value="${state.Bz}" oninput="updateParam('Bz', this.value)" class="w-full h-1 bg-gray-700 rounded accent-blue-500">
                        </div>
                    </div>
                </div>
            `;

            if (state.mode === 'wire') {
                html += bFieldHTML;
                html += `
                    <div class="bg-sandbox-900 p-2.5 rounded border border-emerald-900/40">
                        <label class="text-[10px] uppercase font-bold text-emerald-400 block mb-2">Wire Parameters</label>
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400"><span>Current I (Amps)</span><span id="lbl-wireCurrent">${state.wireCurrent.toFixed(1)}</span></div>
                            <input type="range" min="-10" max="10" step="0.5" value="${state.wireCurrent}" oninput="updateParam('wireCurrent', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                        </div>
                    </div>
                `;
            } 
            else if (state.mode === 'charge') {
                html += bFieldHTML;
                html += `
                    <div class="bg-sandbox-900 p-2.5 rounded border border-emerald-900/40">
                        <label class="text-[10px] uppercase font-bold text-emerald-400 block mb-2">Charge Injection Velocity (m/s)</label>
                        <div class="space-y-2">
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Vx</span><span id="lbl-chargeVx">${state.chargeVx.toFixed(1)}</span></div>
                                <input type="range" min="-10" max="10" step="0.5" value="${state.chargeVx}" oninput="updateParam('chargeVx', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Vy</span><span id="lbl-chargeVy">${state.chargeVy.toFixed(1)}</span></div>
                                <input type="range" min="-10" max="10" step="0.5" value="${state.chargeVy}" oninput="updateParam('chargeVy', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Vz</span><span id="lbl-chargeVz">${state.chargeVz.toFixed(1)}</span></div>
                                <input type="range" min="-10" max="10" step="0.5" value="${state.chargeVz}" oninput="updateParam('chargeVz', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                            </div>
                        </div>
                    </div>
                    <div class="bg-sandbox-900 p-2.5 rounded border border-amber-900/40">
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase text-amber-400"><span>Charge (q)</span><span id="lbl-q">${state.q > 0 ? '+':''}${state.q} C</span></div>
                            <input type="range" min="-5" max="5" step="1" value="${state.q}" oninput="updateParam('q', this.value)" class="w-full h-1 bg-gray-700 rounded accent-amber-500 mt-1">
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button id="btn-play" onclick="togglePlay()" class="w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded font-bold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> Play
                        </button>
                        <button onclick="resetCharge()" class="w-12 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded font-bold transition flex items-center justify-center">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>
                `;
            }
            else if (state.mode === 'twowires') {
                html += `
                    <div class="bg-sandbox-900 p-2.5 rounded border border-emerald-900/40">
                        <label class="text-[10px] uppercase font-bold text-emerald-400 block mb-2">Wire Currents</label>
                        <div class="space-y-3">
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Wire 1 (Amps)</span><span id="lbl-i1">${state.i1.toFixed(1)}</span></div>
                                <input type="range" min="-10" max="10" step="0.5" value="${state.i1}" oninput="updateParam('i1', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Wire 2 (Amps)</span><span id="lbl-i2">${state.i2.toFixed(1)}</span></div>
                                <input type="range" min="-10" max="10" step="0.5" value="${state.i2}" oninput="updateParam('i2', this.value)" class="w-full h-1 bg-gray-700 rounded accent-emerald-500">
                            </div>
                        </div>
                    </div>
                    <div class="bg-sandbox-900 p-2.5 rounded border border-purple-900/40 mt-3">
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400"><span>Separation Distance (d)</span><span id="lbl-distance">${state.distance.toFixed(1)}</span></div>
                            <input type="range" min="1" max="10" step="0.5" value="${state.distance}" oninput="updateParam('distance', this.value)" class="w-full h-1 bg-gray-700 rounded accent-purple-500">
                        </div>
                    </div>
                `;
            }
            panel.innerHTML = html;
        }

        // Init
        window.setMode('wire');

    </script>
</body>
</html>
